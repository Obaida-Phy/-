<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب ساعات الهيئة المعاونة</title>

<style>
    *{
        box-sizing:border-box;
        font-family:"Times New Roman", Times, serif;
    }

    body{
        margin:0;
        background:#f4f6f9;
        color:#222;
    }

    .container{
        max-width:1200px;
        margin:30px auto;
        padding:0 15px;
    }

    h1{
        text-align:center;
        margin-bottom:8px;
        color:#1f3b5b;
    }

    .subtitle{
        text-align:center;
        color:#666;
        margin-bottom:25px;
    }

    .card{
        background:#fff;
        border-radius:12px;
        padding:18px;
        margin-bottom:18px;
        box-shadow:0 3px 12px rgba(0,0,0,.08);
        overflow-x:auto;
    }

    table{
        width:100%;
        border-collapse:collapse;
        min-width:760px;
    }

    th,td{
        border:1px solid #d9dee5;
        padding:9px;
        text-align:center;
    }

    th{
        background:#1f3b5b;
        color:white;
    }

    tr.section td{
        background:#eaf0f6;
        font-weight:bold;
        color:#1f3b5b;
    }

    input{
        width:100%;
        padding:7px;
        border:1px solid #bbb;
        border-radius:6px;
        text-align:center;
        font-size:15px;
    }

    input:focus{
        outline:2px solid #8bb7dd;
        border-color:#4d89bd;
    }

    .hours{
        font-weight:bold;
        background:#f7f9fb;
    }

    .settings{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:15px;
    }

    .setting{
        background:#f9fbfd;
        border:1px solid #d8e0e8;
        border-radius:10px;
        padding:15px;
    }

    .setting label{
        display:block;
        font-weight:bold;
        color:#1f3b5b;
        margin-bottom:8px;
    }

    .results{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:15px;
    }

    .result{
        border:1px solid #d8e0e8;
        border-radius:10px;
        padding:15px;
        background:#f9fbfd;
        text-align:center;
    }

    .result .label{
        color:#555;
        margin-bottom:8px;
    }

    .result .value{
        font-size:26px;
        font-weight:bold;
        color:#1f3b5b;
    }

    .actions{
        text-align:center;
        margin:20px 0;
    }

    button{
        border:0;
        border-radius:8px;
        padding:11px 20px;
        margin:4px;
        cursor:pointer;
        font-size:15px;
        background:#1f3b5b;
        color:white;
    }

    button.secondary{
        background:#6c757d;
    }

    .note{
        font-size:13px;
        color:#777;
        margin-top:10px;
    }

    @media(max-width:600px){
        .container{
            margin-top:15px;
        }

        h1{
            font-size:24px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>حاسبة الساعات</h1>

    <div class="subtitle">
        قسم الفيزياء
    </div>


    <!-- إعدادات المستخدم -->
    <div class="card">

        <h2>الإعدادات</h2>

        <div class="settings">

            <!-- عدد الهيئة المعاونة -->
            <div class="setting">

                <label for="staffCount">
                    عدد الهيئة المعاونة الكلي
                </label>

                <input
                    type="number"
                    id="staffCount"
                    value="26"
                    min="1"
                    step="1"
                    oninput="calculate()"
                >

            </div>


            <!-- تقريب الساعات -->
            <div class="setting">

                <label for="roundHours">
                    تقريب الساعات
                </label>

                <input
                    type="number"
                    id="roundHours"
                    value="26"
                    min="0"
                    step="any"
                    oninput="calculate()"
                >

            </div>

        </div>

        <div class="note">
            أدخل عدد الساعات الذي تريد اعتماده للفرد الواحد في خانة "تقريب الساعات".
        </div>

    </div>


    <!-- جدول البيانات -->
    <div class="card">

        <table>

            <thead>

                <tr>
                    <th>المستوى</th>
                    <th>المعامل</th>
                    <th>عدد المعامل أسبوعياً</th>
                    <th>ساعات المعمل الواحد</th>
                    <th>الهيئة المعاونة في المعمل الواحد</th>
                    <th>س
